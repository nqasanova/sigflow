[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "msgc"
version = "0.3.0"
description = "Compiler for sigflow .msg schemas (C++ and Python backends)"
requires-python = ">=3.9"
# No runtime dependencies on purpose, the build should only need Python.
dependencies = []

[project.scripts]
msgc = "msgc.__main__:main"

[tool.setuptools.packages.find]
include = ["msgc*"]
